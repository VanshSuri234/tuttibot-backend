services:
  - type: web
    name: tuttibot-backend
    runtime: python
    pythonVersion: 3.10
    preBuildCommand: apt-get update && apt-get install -y libportaudio2 libportaudiocpp0 portaudio19-dev 2>&1 | tail -5 || echo "PortAudio headers installation attempted"
    buildCommand: bash build.sh
    startCommand: gunicorn -w 4 -b 0.0.0.0:$PORT -t 300 app:app
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
